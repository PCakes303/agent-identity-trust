name: Validate identity contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate principal example against normative schema
        run: python tools/validate_principal.py
      - name: Run schema-parity regression tests
        run: python -m unittest discover -s tests -v
      - name: Run starter build
        run: python tools/starter_build.py
